services:

  # ── Backend — FastAPI ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf_backend
    ports:
      - "8000:8000"
    volumes:
      # Share temp directories with host for uploads/outputs
      - sf_uploads:/tmp/sovereignforge/uploads
      - sf_outputs:/tmp/sovereignforge/outputs
      - sf_network_log:/tmp/sovereignforge
      # Mount Docker socket so backend can spawn sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - TESSERACT_CMD=/usr/bin/tesseract
      # Route ALL outbound HTTP(S) through the sovereignty monitor so the
      # zero-external-call guarantee is enforced, not just displayed.
      # (The Docker SDK talks over the unix socket and is unaffected.)
      - HTTP_PROXY=http://mitmproxy:8080
      - HTTPS_PROXY=http://mitmproxy:8080
      - http_proxy=http://mitmproxy:8080
      - https_proxy=http://mitmproxy:8080
      - NO_PROXY=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sovereignnet
    depends_on:
      - mitmproxy
      - ollama
    restart: unless-stopped

  # ── Frontend — Next.js ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so pass them as build args.
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    container_name: sf_frontend
    ports:
      - "3000:3000"
    networks:
      - sovereignnet
    depends_on:
      - backend
    restart: unless-stopped

  # ── Sovereignty Monitor — mitmproxy ──
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: sf_mitmproxy
    # The shared log volume is root-owned, but the image drops to the
    # unprivileged "mitmproxy" user. Hand it just the log file, then run the
    # image's normal entrypoint (which still drops privileges).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/sovereignforge &&
        touch /tmp/sovereignforge/network.log &&
        chown mitmproxy:mitmproxy /tmp/sovereignforge/network.log &&
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - mitmdump
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --scripts
      - /addons/mitmproxy_addon.py
    volumes:
      - ./sovereignty:/addons
      - sf_network_log:/tmp/sovereignforge
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sovereignnet
    restart: unless-stopped

  # ── Local LLMs — Ollama (CPU unless a GPU runtime is configured) ──
  ollama:
    image: ollama/ollama:latest
    container_name: sf_ollama
    ports:
      # Host access for local dev only; not exposed to the LAN.
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1   # swap models instead of holding all in RAM
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sovereignnet
    restart: unless-stopped

volumes:
  ollama_models:
  sf_uploads:
  sf_outputs:
  sf_network_log:

networks:
  sovereignnet:
    driver: bridge
